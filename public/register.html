<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Registro Facial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-user-circle"></i> Sistema de Registro Facial Smart Site Copany</h1>
      <p>Registre rostros mediante cámara web o subiendo una imagen</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="camera-tab">
        <i class="fas fa-camera"></i> Usar Cámara
      </button>
      <button class="tab-btn" data-tab="image-tab">
        <i class="fas fa-image"></i> Subir Imagen
      </button>
    </div>

    <div id="camera-tab" class="tab-content active">
      <div class="video-container">
        <video id="video" autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>
      
      <div class="btn-group">
        <button onclick="register()" class="btn btn-primary">
          <i class="fas fa-save"></i> Registrar Rostro
        </button>
        <button onclick="clearCameraTab()" class="btn btn-primary">
          <i class="fas fa-broom"></i> Limpiar Pantalla
        </button>
        <a href="index.html" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Volver al Inicio
        </a>
      </div>
    </div>
     
    <div id="image-tab" class="tab-content">
      <form id="register-form" method="POST" enctype="multipart/form-data">
        <div class="form-group">
          <button type="button" class="btn btn-primary" onclick="document.getElementById('image-upload').click()">
            <i class="fas fa-upload"></i> Seleccionar Imagen
          </button>
          <input type="file" id="image-upload" name="image" accept="image/*" style="display: none;" required />
          <span id="file-name" class="file-name"></span>
        </div>
        
        <div id="image-preview-container" style="margin: 20px 0; display: none;">
          <img id="register-preview" class="preview-image" />
        </div>
        
        <div class="btn-group">
          <button type="submit" class="btn btn-primary" id="register-btn" disabled>
            <i class="fas fa-check-circle"></i> Registrar Rostro
          </button>
          <button type="button" onclick="clearImageTab()" class="btn btn-primary">
            <i class="fas fa-broom"></i> Limpiar Pantalla
          </button>
          <a href="index.html" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver al Inicio
          </a>
        </div>
      </form>
      
      <div id="register-result" style="display: none;"></div>
      
      <h3 style="margin-top: 2rem; color: var(--primary-color);">
        <i class="fas fa-list"></i> Rostros Registrados
      </h3>
      <ul id="register-list"></ul>
    </div>
  </div>

  <footer>
    <p> © 2025 Smart Site Company. Todos los derechos reservados.</p>
  </footer>

  <script>
    // Script para manejar las pestañas
    document.addEventListener('DOMContentLoaded', function() {
      const tabBtns = document.querySelectorAll('.tab-btn');
      
      tabBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          const tabId = this.getAttribute('data-tab');
          
          // Remover clase active de todos los botones y contenidos
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          
          // Agregar clase active al botón y contenido seleccionado
          this.classList.add('active');
          document.getElementById(tabId).classList.add('active');
        });
      });
      
      // Mostrar vista previa de la imagen seleccionada
      const imageUpload = document.getElementById('image-upload');
      if(imageUpload) {
        imageUpload.addEventListener('change', function(e) {
          const file = e.target.files[0];
          const registerBtn = document.getElementById('register-btn');
          const previewContainer = document.getElementById('image-preview-container');
          
          if(file) {
            document.getElementById('file-name').textContent = file.name;
            registerBtn.disabled = false;
            
            const reader = new FileReader();
            reader.onload = function(event) {
              const preview = document.getElementById('register-preview');
              preview.src = event.target.result;
              previewContainer.style.display = 'block';
            }
            reader.readAsDataURL(file);
          } else {
            registerBtn.disabled = true;
            previewContainer.style.display = 'none';
          }
        });
      }

      // Efectos para botones
      document.querySelectorAll('.btn').forEach(button => {
        // Efecto de onda al hacer clic
        button.addEventListener('click', function(e) {
          if(this.type === 'file') return;
          
          const x = e.clientX - e.target.getBoundingClientRect().left;
          const y = e.clientY - e.target.getBoundingClientRect().top;
          
          const ripple = document.createElement('span');
          ripple.classList.add('ripple');
          ripple.style.left = `${x}px`;
          ripple.style.top = `${y}px`;
          
          this.appendChild(ripple);
          
          setTimeout(() => {
            ripple.remove();
          }, 1000);
        });
        
        // Efecto de hover
        button.addEventListener('mouseenter', () => {
          button.style.transform = 'translateY(-3px)';
        });
        
        button.addEventListener('mouseleave', () => {
          button.style.transform = 'translateY(0)';
        });
      });
    });

    // Función para limpiar la pestaña de cámara
    function clearCameraTab() {
      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');
      
      // Detener la transmisión de video
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      
      // Limpiar el canvas
      const context = overlay.getContext('2d');
      context.clearRect(0, 0, overlay.width, overlay.height);
      
      // Reiniciar el video
      video.srcObject = null;
    }

    // Función para limpiar la pestaña de imagen
    function clearImageTab() {
      document.getElementById('image-upload').value = '';
      document.getElementById('file-name').textContent = '';
      document.getElementById('image-preview-container').style.display = 'none';
      document.getElementById('register-preview').src = '';
      document.getElementById('register-result').style.display = 'none';
      document.getElementById('register-result').innerHTML = '';
      document.getElementById('register-btn').disabled = true;
    }
  </script>
  <script src="script.js"></script>
  <script src="register.js"></script>
</body>
</html>
